<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ireko</title>
    <link rel="stylesheet" href="style.css" />
    <!--
      Mermaid is loaded from a CDN. For offline use, replace this with a
      vendored copy; ireko passes the body opaquely so any Mermaid build works.
    -->
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
      mermaid.initialize({ startOnLoad: false, securityLevel: "loose" });
      window.__ireko_mermaid = mermaid;
    </script>
  </head>
  <body>
    <header class="ireko-header">
      <nav id="breadcrumbs" aria-label="Breadcrumb"></nav>
      <h1 id="title">ireko</h1>
    </header>
    <main id="diagram-root" role="main">
      <p class="ireko-loading">Loading…</p>
    </main>
    <footer class="ireko-footer">
      <span>Rendered with
        <a href="https://mermaid.js.org/" target="_blank" rel="noopener">Mermaid</a>
        · Built with
        <a href="https://github.com/" target="_blank" rel="noopener">ireko</a>
      </span>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
